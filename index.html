<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patriot Hashtag Studio</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root {
  --bg: var(--tg-theme-bg-color, #f5f5f5);
  --text: var(--tg-theme-text-color, #111);
  --hint: var(--tg-theme-hint-color, #777);
  --button: var(--tg-theme-button-color, #2481cc);
  --button-text: var(--tg-theme-button-text-color, #fff);
  --card: var(--tg-theme-secondary-bg-color, #fff);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 18px;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}

.container {
  max-width: 650px;
  margin: auto;
}

.logo {
  color: var(--button);
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 2px;
}

h1 {
  margin: 7px 0;
  font-size: 27px;
}

.subtitle {
  color: var(--hint);
  font-size: 14px;
}

.card {
  background: var(--card);
  border-radius: 16px;
  padding: 17px;
  margin: 15px 0;
}

label {
  display: block;
  font-weight: bold;
  margin: 12px 0 7px;
}

input, select {
  width: 100%;
  padding: 13px;
  border-radius: 11px;
  border: 1px solid var(--tg-theme-hint-color, #ccc);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: 0;
  border-radius: 12px;
  background: var(--button);
  color: var(--button-text);
  font-weight: bold;
  font-size: 15px;
}

.hashtags {
  background: var(--bg);
  padding: 15px;
  border-radius: 12px;
  line-height: 1.8;
  font-size: 14px;
  word-break: break-word;
}

.section-title {
  font-weight: bold;
  margin-bottom: 8px;
}

#app {
  display: none;
}

#guard {
  position: fixed;
  inset: 0;
  background: var(--bg);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 30px;
  z-index: 9999;
}

.guard-box {
  max-width: 330px;
}
</style>
</head>

<body>

<div id="guard">
  <div class="guard-box">
    <h2>Open Patriot Hashtag Studio in Telegram</h2>
    <p>This Mini App is designed to run inside Telegram.</p>
  </div>
</div>

<div id="app">
<div class="container">

<div class="logo">PATRIOT SIGNAL</div>
<h1>Hashtag Studio</h1>
<div class="subtitle">
  Generate hashtag groups for your social content.
</div>

<div class="card">

<label>Topic / keyword</label>
<input id="topic" placeholder="Example: music promotion">

<label>Category</label>
<select id="category">
  <option value="marketing">Marketing</option>
  <option value="music">Music</option>
  <option value="business">Business</option>
  <option value="fitness">Fitness</option>
  <option value="fashion">Fashion</option>
  <option value="travel">Travel</option>
  <option value="technology">Technology</option>
  <option value="food">Food</option>
  <option value="gaming">Gaming</option>
  <option value="creator">Content Creator</option>
</select>

<button onclick="generate()">Generate Hashtags</button>

</div>

<div class="card">

<div class="section-title">Broad hashtags</div>
<div class="hashtags" id="broad">
  Generate hashtags to see results.
</div>

<br>

<div class="section-title">Niche hashtags</div>
<div class="hashtags" id="niche"></div>

<br>

<div class="section-title">Content hashtags</div>
<div class="hashtags" id="contentTags"></div>

<button onclick="copyAll()">Copy All Hashtags</button>
<button onclick="sendTags()">Send to Telegram</button>

</div>

</div>
</div>

<script>
const tg = window.Telegram?.WebApp;
const guard = document.getElementById("guard");
const app = document.getElementById("app");

let allTags = "";

const tagData = {

marketing: [
  "#Marketing",
  "#DigitalMarketing",
  "#MarketingTips",
  "#SocialMediaMarketing",
  "#MarketingStrategy",
  "#OnlineMarketing",
  "#BrandMarketing",
  "#BusinessMarketing"
],

music: [
  "#Music",
  "#NewMusic",
  "#MusicPromotion",
  "#MusicMarketing",
  "#IndependentArtist",
  "#Musician",
  "#Singer",
  "#NewMusicFriday"
],

business: [
  "#Business",
  "#Entrepreneur",
  "#Entrepreneurship",
  "#SmallBusiness",
  "#BusinessTips",
  "#OnlineBusiness",
  "#Startup",
  "#BusinessOwner"
],

fitness: [
  "#Fitness",
  "#Workout",
  "#FitnessMotivation",
  "#Gym",
  "#HealthyLifestyle",
  "#FitnessTips",
  "#WorkoutMotivation",
  "#Training"
],

fashion: [
  "#Fashion",
  "#FashionStyle",
  "#Style",
  "#FashionTrends",
  "#StreetStyle",
  "#OutfitIdeas",
  "#FashionInspiration",
  "#OOTD"
],

travel: [
  "#Travel",
  "#TravelTips",
  "#TravelPhotography",
  "#Vacation",
  "#Adventure",
  "#TravelLife",
  "#Explore",
  "#Wanderlust"
],

technology: [
  "#Technology",
  "#Tech",
  "#TechNews",
  "#Innovation",
  "#Digital",
  "#AI",
  "#FutureTech",
  "#TechTips"
],

food: [
  "#Food",
  "#Foodie",
  "#FoodPhotography",
  "#FoodLover",
  "#Cooking",
  "#Recipe",
  "#HealthyFood",
  "#FoodBlog"
],

gaming: [
  "#Gaming",
  "#Gamer",
  "#GamingCommunity",
  "#VideoGames",
  "#GamingLife",
  "#GameOn",
  "#GamingContent",
  "#Streamer"
],

creator: [
  "#ContentCreator",
  "#Creator",
  "#ContentCreation",
  "#SocialMedia",
  "#CreatorTips",
  "#DigitalCreator",
  "#Influencer",
  "#CreatorEconomy"
]

};

if (tg && tg.initData) {
  guard.style.display = "none";
  app.style.display = "block";

  tg.ready();
  tg.expand();

  if (tg.BackButton) {
    tg.BackButton.show();
    tg.BackButton.onClick(() => tg.close());
  }
}

function cleanTopic(topic) {
  return topic
    .replace(/[^a-zA-Z0-9 ]/g, "")
    .trim()
    .split(/\s+/)
    .filter(Boolean)
    .join("");
}

function generate() {

  const topic = document.getElementById("topic").value.trim();
  const category = document.getElementById("category").value;

  if (!topic) {
    alert("Enter a topic or keyword.");
    return;
  }

  const topicTag = "#" + cleanTopic(topic);

  const base = tagData[category] || [];

  const broad = [
    topicTag,
    base[0],
    base[1],
    base[2]
  ];

  const niche = [
    topicTag,
    ...base.slice(3, 8)
  ];

  const content = [
    topicTag,
    "#" + cleanTopic(topic) + "Tips",
    "#" + cleanTopic(topic) + "Community",
    "#" + cleanTopic(topic) + "Content",
    base[1],
    base[5]
  ];

  document.getElementById("broad").textContent =
    [...new Set(broad)].join(" ");

  document.getElementById("niche").textContent =
    [...new Set(niche)].join(" ");

  document.getElementById("contentTags").textContent =
    [...new Set(content)].join(" ");

  allTags =
    [...new Set([...broad, ...niche, ...content])].join(" ");
}

async function copyAll() {

  if (!allTags) {
    generate();
  }

  if (!allTags) return;

  await navigator.clipboard.writeText(allTags);
  alert("Hashtags copied.");
}

function sendTags() {

  if (!allTags) {
    generate();
  }

  if (tg && allTags) {
    tg.sendData(JSON.stringify({
      app: "Patriot Hashtag Studio",
      hashtags: allTags
    }));
  }
}
</script>

</body>
</html>
